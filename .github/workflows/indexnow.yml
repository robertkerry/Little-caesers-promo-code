name: IndexNow ping (changed pages only)

on:
  push:
    branches: [main]

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed HTML pages
        id: changed
        run: |
          # Diff against the previous commit on this push. Fall back to the
          # single commit's own changes if there's no prior commit (first push).
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            DIFF_RANGE="HEAD^ HEAD"
          else
            DIFF_RANGE="HEAD"
          fi

          CHANGED_FILES=$(git diff --name-only $DIFF_RANGE -- '*.html' || true)

          URLS=""
          for f in $CHANGED_FILES; do
            # Skip the custom 404 page — it isn't a real indexable URL.
            if [ "$f" = "404.html" ]; then
              continue
            fi
            if [ "$f" = "index.html" ]; then
              URL="https://littlecaesarscoupons.us/"
            else
              # folder/index.html -> https://littlecaesarscoupons.us/folder/
              DIR=$(dirname "$f")
              URL="https://littlecaesarscoupons.us/${DIR}/"
            fi
            URLS="${URLS}${URL}\n"
          done

          echo "urls<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$URLS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Ping IndexNow for changed pages
        if: steps.changed.outputs.urls != ''
        run: |
          KEY="7b38c59af3c2f1fbf5857aad257a3d84"
          HOST="littlecaesarscoupons.us"

          # Build a JSON array from the newline-separated URL list.
          URL_LIST_JSON=$(printf '%s\n' "${{ steps.changed.outputs.urls }}" | \
            awk 'NF' | \
            python3 -c "import sys, json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")

          if [ "$URL_LIST_JSON" = "[]" ]; then
            echo "No changed HTML pages to submit."
            exit 0
          fi

          echo "Submitting: $URL_LIST_JSON"

          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"${HOST}\",\"key\":\"${KEY}\",\"keyLocation\":\"https://${HOST}/${KEY}.txt\",\"urlList\":${URL_LIST_JSON}}"
